<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tic-Tac-Toe Nexus</title>
    <style>
        @layer base {
            html, body {
                margin: 0;
                padding: 0;
            }
            body {
                overscroll-behavior: none;
                background-color: #000000;
                min-height: 100vh;
            }
            main > :first-child {
                margin-top: 0 !important;
            }
            main > :last-child {
                margin-bottom: 0 !important;
            }
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#323537",
                        "tertiary-container": "#dedbde",
                        "on-primary-fixed": "#002022",
                        "secondary-container": "#ff24e4",
                        "on-secondary-fixed": "#3a0033",
                        "outline-variant": "#3a494b",
                        "surface": "#101415",
                        "on-secondary-container": "#520049",
                        "outline": "#849495",
                        "on-surface-variant": "#b9cacb",
                        "surface-container-highest": "#323537",
                        "tertiary": "#fbf7fa",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "on-primary": "#00373a",
                        "surface-tint": "#00dce6",
                        "on-tertiary-fixed": "#1b1b1d",
                        "on-tertiary-fixed-variant": "#474649",
                        "inverse-primary": "#00696f",
                        "on-surface": "#e0e3e5",
                        "surface-container-lowest": "#0b0f10",
                        "surface-bright": "#363a3b",
                        "on-tertiary-container": "#616062",
                        "secondary-fixed": "#ffd7f0",
                        "primary-fixed": "#6ff6ff",
                        "on-secondary-fixed-variant": "#840076",
                        "error": "#ffb4ab",
                        "primary-container": "#00f3ff",
                        "tertiary-fixed": "#e5e1e4",
                        "primary-fixed-dim": "#00dce6",
                        "inverse-on-surface": "#2d3133",
                        "surface-dim": "#101415",
                        "background": "#101415",
                        "on-background": "#e0e3e5",
                        "secondary": "#fface8",
                        "on-primary-fixed-variant": "#004f53",
                        "surface-container-low": "#191c1e",
                        "surface-container": "#1d2022",
                        "on-tertiary": "#303032",
                        "surface-container-high": "#272a2c",
                        "secondary-fixed-dim": "#fface8",
                        "primary": "#e3fdff",
                        "error-container": "#93000a",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#006b71"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-md": "1.5rem",
                        "container-padding": "2rem",
                        "stack-lg": "3rem",
                        "grid-gap": "1rem",
                        "stack-sm": "0.5rem"
                    },
                    fontFamily: {
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-base": ["Inter"],
                        "label-caps": ["Geist"],
                        "display-marker": ["Inter"]
                    },
                    fontSize: {
                        "display-lg": ["72px", {"lineHeight": "80px", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-base": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "display-marker": ["48px", {"lineHeight": "48px", "letterSpacing": "0.02em", "fontWeight": "300"}]
                    }
                }
            }
        };
    </script>
    <link href="styles.css" rel="stylesheet"/>
    <script type="module" src="script.js" defer></script>
</head>
<body class="bg-surface font-body-base text-on-surface flex flex-col min-h-screen items-center justify-center">
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-variant/20 via-surface to-background pointer-events-none -z-10"></div>
    
    <header class="fixed top-0 w-full h-20 flex items-center justify-center pointer-events-none">
        <h1 class="font-label-caps text-label-caps tracking-[0.4em] text-on-surface-variant uppercase opacity-60">Tic-Tac-Toe</h1>
    </header>

    <main class="region-game relative transition-all duration-700 ease-in-out">
        
        <!-- 1. Player Setup Form Configuration -->
        <section class="block-setup py-stack-lg" data-state="active">
            <form class="composition-cluster">
                <h2 class="block-setup-title">Configure Contenders</h2>
                
                <div class="flex flex-col gap-1">
                    <label for="p1-name" class="block-setup-label">Player X (Nexus X)</label>
                    <input type="text" id="p1-name" placeholder="Enter Name" class="block-setup-input" required value="Nexus X" />
                </div>
                
                <div class="flex flex-col gap-1">
                    <label for="p2-name" class="block-setup-label">Player O (Void O)</label>
                    <input type="text" id="p2-name" placeholder="Enter Name" class="block-setup-input" required value="Void O" />
                </div>

                <button type="submit" class="block-button" data-variant="primary">
                    INITIALIZE MATCH
                </button>
            </form>
        </section>

        <!-- 2. Accessible Status Announcer (ARIA live region) -->
        <div class="block-status sr-only" aria-live="polite" aria-atomic="true">
            Match configured. Ready to start.
        </div>

        <!-- 3. Active Gameplay Workspace (Initially inactive/hidden) -->
        <div class="game-workspace flex flex-col items-center py-stack-lg w-full" id="game-workspace" data-state="inactive">
            <!-- Turn Indicator -->
            <div class="mb-stack-lg transition-all duration-500 transform" id="turn-indicator">
                <div class="flex flex-col items-center gap-stack-sm">
                    <span class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.3em] uppercase opacity-50">Current Sequence</span>
                    <div class="flex items-center gap-4">
                        <div class="block-turn-marker" id="turn-marker-x" data-active="true">
                            <span class="material-symbols-outlined text-[20px]">close</span>
                            <span class="font-headline-md text-headline-md">PLAYER X</span>
                        </div>
                        <div class="block-turn-marker" id="turn-marker-o" data-active="false">
                            <span class="material-symbols-outlined text-[20px]">radio_button_unchecked</span>
                            <span class="font-headline-md text-headline-md">PLAYER O</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Glass Board -->
            <div class="relative group mb-stack-lg">
                <!-- Ambient Glow Backgrounds -->
                <div class="absolute -inset-8 bg-primary/5 blur-[80px] rounded-full opacity-50 group-hover:opacity-70 transition-opacity duration-1000"></div>
                <div class="absolute -inset-8 bg-secondary/5 blur-[80px] rounded-full opacity-30 translate-x-12 translate-y-12 group-hover:opacity-50 transition-opacity duration-1000"></div>
                
                <section class="block-board" role="region" aria-label="Tic Tac Toe Board">
                    <div class="composition-grid w-full max-w-[420px] sm:w-[420px]" id="board" role="grid" aria-label="Tic Tac Toe Board">
                        <!-- 9 pre-rendered buttons for focus preservation and high contrast focus rings -->
                        <button class="block-square game-cell group/cell" data-index="0" aria-label="Row 1, Column 1: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell group/cell" data-index="1" aria-label="Row 1, Column 2: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell group/cell" data-index="2" aria-label="Row 1, Column 3: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell group/cell" data-index="3" aria-label="Row 2, Column 1: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell group/cell" data-index="4" aria-label="Row 2, Column 2: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell group/cell" data-index="5" aria-label="Row 2, Column 3: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell group/cell" data-index="6" aria-label="Row 3, Column 1: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell group/cell" data-index="7" aria-label="Row 3, Column 2: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell group/cell" data-index="8" aria-label="Row 3, Column 3: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined text-primary text-[64px] drop-shadow-[0_0_15px_rgba(0,220,230,0.4)]" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined text-secondary text-[64px] drop-shadow-[0_0_15px_rgba(255,36,228,0.4)]" data-visible="false">radio_button_unchecked</span>
                        </button>
                    </div>

                    <!-- SVG Winning Line Overlay (dashed animation sweep) -->
                    <svg class="absolute inset-0 pointer-events-none w-full h-full p-grid-gap opacity-0" id="winning-line-svg">
                        <line class="drop-shadow-[0_0_10px_currentColor]" id="winning-line" stroke="currentColor" stroke-linecap="round" stroke-width="4" pathLength="1" x1="0" x2="0" y1="0" y2="0"></line>
                    </svg>
                </section>
            </div>

            <!-- Scoreboard & Controls -->
            <div class="w-full max-w-[420px] flex flex-col gap-stack-md">
                <div class="grid grid-cols-2 gap-stack-md">
                    <!-- Player X Score -->
                    <div class="block-score-card" id="score-x-card" data-player="X" data-active="true">
                        <span class="block-score-card-label">Nexus X</span>
                        <span class="block-score-card-value" id="score-x">00</span>
                    </div>
                    <!-- Player O Score -->
                    <div class="block-score-card" id="score-o-card" data-player="O" data-active="false">
                        <span class="block-score-card-label">Void O</span>
                        <span class="block-score-card-value" id="score-o">00</span>
                    </div>
                </div>
                
                <div class="flex items-center justify-between gap-stack-md">
                    <button class="block-button flex-1" data-variant="outline" data-action="reset">
                        <span class="material-symbols-outlined text-[18px] transition-transform duration-500">refresh</span>
                        RESET ARCHIVE
                    </button>
                    <button class="w-12 h-12 flex items-center justify-center rounded-lg border border-outline/30 text-on-surface-variant hover:text-primary transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                        <span class="material-symbols-outlined">settings</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Win Modal (Enhanced with dialog role and accessibilities) -->
        <div class="block-modal" id="win-modal" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="winner-text">
            <div class="block-modal-card" id="modal-card">
                <span class="block-modal-subtitle">Transmission Received</span>
                <h2 class="block-modal-title" id="winner-text">PLAYER X WINS</h2>
                <button class="w-full py-4 bg-primary text-on-primary font-label-caps text-label-caps tracking-widest rounded-lg hover:brightness-110 transition-all shadow-lg shadow-primary/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface" id="modal-cta-button">RE-ENGAGE</button>
            </div>
        </div>
    </main>

    <!-- Wrapped Profile Widget button -->
    <button class="fixed bottom-container-padding right-container-padding flex gap-stack-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded-full" aria-label="View Profile">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center transition-transform hover:scale-110">
            <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
        </div>
    </button>
</body>
</html>
