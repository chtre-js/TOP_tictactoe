<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Classic Tic-Tac-Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="styles.css" rel="stylesheet"/>
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <div class="block-bg-glow"></div>
    
    <header class="block-header">
        <h1 class="block-header-title">Tic-Tac-Toe</h1>
    </header>

    <main class="region-game">
        
        <!-- 1. Player Setup Form Configuration -->
        <section class="block-setup" data-state="active">
            <form class="composition-cluster">
                <h2 class="block-setup-title">Match Setup</h2>
                
                <div class="composition-field">
                    <label for="p1-name" class="block-setup-label">Player One (X)</label>
                    <input type="text" id="p1-name" placeholder="Enter Name" class="block-setup-input" required value="Player One" />
                </div>
                
                <div class="composition-field">
                    <label for="p2-name" class="block-setup-label">Player Two (O)</label>
                    <input type="text" id="p2-name" placeholder="Enter Name" class="block-setup-input" required value="Player Two" />
                </div>

                <button type="submit" class="block-button" data-variant="primary">
                    BEGIN MATCH
                </button>
            </form>
        </section>

        <!-- 2. Accessible Status Announcer (ARIA live region) -->
        <div class="block-status sr-only" aria-live="polite" aria-atomic="true">
            Match configured. Ready to start.
        </div>

        <!-- 3. Active Gameplay Workspace (Initially inactive/hidden) -->
        <div class="game-workspace" id="game-workspace" data-state="inactive">
            <!-- Turn Indicator -->
            <div class="block-turn-indicator" id="turn-indicator">
                <div class="composition-turn-container">
                    <span class="block-turn-label">Active Turn</span>
                    <div class="composition-turn-markers">
                        <div class="block-turn-marker" id="turn-marker-x" data-active="true">
                            <span class="material-symbols-outlined block-turn-marker-icon">close</span>
                            <span class="block-turn-marker-text">PLAYER ONE</span>
                        </div>
                        <div class="block-turn-marker" id="turn-marker-o" data-active="false">
                            <span class="material-symbols-outlined block-turn-marker-icon">radio_button_unchecked</span>
                            <span class="block-turn-marker-text">PLAYER TWO</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Glass Board -->
            <div class="block-board-wrapper">
                <!-- Ambient Glow Backgrounds -->
                <div class="block-board-glow-1"></div>
                <div class="block-board-glow-2"></div>
                
                <section class="block-board" role="region" aria-label="Tic Tac Toe Board">
                    <div class="composition-grid" id="board" role="grid" aria-label="Tic Tac Toe Board">
                        <!-- 9 pre-rendered buttons for focus preservation and high contrast focus rings -->
                        <button class="block-square game-cell" data-index="0" aria-label="Row 1, Column 1: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell" data-index="1" aria-label="Row 1, Column 2: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell" data-index="2" aria-label="Row 1, Column 3: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell" data-index="3" aria-label="Row 2, Column 1: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell" data-index="4" aria-label="Row 2, Column 2: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell" data-index="5" aria-label="Row 2, Column 3: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell" data-index="6" aria-label="Row 3, Column 1: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell" data-index="7" aria-label="Row 3, Column 2: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                        <button class="block-square game-cell" data-index="8" aria-label="Row 3, Column 3: Empty" aria-disabled="false">
                            <span class="marker-x material-symbols-outlined" data-visible="false">close</span>
                            <span class="marker-o material-symbols-outlined" data-visible="false">radio_button_unchecked</span>
                        </button>
                    </div>

                    <!-- SVG Winning Line Overlay (dashed animation sweep) -->
                    <svg class="block-board-winning-svg opacity-0" id="winning-line-svg">
                        <line class="drop-shadow-[0_0_10px_currentColor]" id="winning-line" stroke="currentColor" stroke-linecap="round" stroke-width="4" pathLength="1" x1="0" x2="0" y1="0" y2="0"></line>
                    </svg>
                </section>
            </div>

            <!-- Scoreboard & Controls -->
            <div class="composition-scoreboard-wrapper">
                <div class="composition-scoreboard-grid">
                    <!-- Player X Score -->
                    <div class="block-score-card" id="score-x-card" data-player="X" data-active="true">
                        <span class="block-score-card-label">Player One</span>
                        <span class="block-score-card-value" id="score-x">00</span>
                    </div>
                    <!-- Player O Score -->
                    <div class="block-score-card" id="score-o-card" data-player="O" data-active="false">
                        <span class="block-score-card-label">Player Two</span>
                        <span class="block-score-card-value" id="score-o">00</span>
                    </div>
                </div>
                
                <div class="composition-controls">
                    <button class="block-button flex-1" data-variant="outline" data-action="reset">
                        <span class="material-symbols-outlined block-button-icon">refresh</span>
                        RESET BOARD
                    </button>
                </div>
            </div>
        </div>

        <!-- Win Modal (Enhanced with dialog role and accessibilities) -->
        <div class="block-modal" id="win-modal" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="winner-text">
            <div class="block-modal-card" id="modal-card">
                <span class="block-modal-subtitle">Match Result</span>
                <h2 class="block-modal-title" id="winner-text">PLAYER ONE WINS</h2>
                <button class="block-button" data-variant="modal-cta" id="modal-cta-button">PLAY AGAIN</button>
            </div>
        </div>
    </main>
</body>
</html>
